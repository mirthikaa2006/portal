[project]
name = "mithuna-impact-selector"
version = "0.1.0"
description = "Change-impact test selector for a multilingual government portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
mithuna-select = "impact_selector.cli:main"
mithuna-generate = "scripts.generate_data:main"

[tool.setuptools.packages.find]
include = ["impact_selector*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
